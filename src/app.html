<!doctype html>
<html
	lang="en"
	data-theme="vitroidfpv"
	data-mode="dark"
>
	<head>
		<script
			defer
			data-domain="next.vitroidfpv.com"
			src="https://vitroidfpv-plausible.up.railway.app/js/script.file-downloads.hash.outbound-links.pageview-props.tagged-events.js"
		></script>
		<script>
			window.plausible =
				window.plausible ||
				function () {
					;(window.plausible.q = window.plausible.q || []).push(arguments)
				}
		</script>
		<script>
			document.documentElement.setAttribute(
				"data-mode",
				localStorage.getItem("mode") || "dark"
			)
		</script>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1"
		/>
		<meta
			name="text-scale"
			content="scale"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
